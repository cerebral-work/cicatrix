# gitleaks config for cicatrix.
#
# Extends the default gitleaks ruleset. Allowlists cover generated artifacts and
# in-tree fixtures that trip false positives — real credentials MUST NOT be added here.
# Reference: https://github.com/gitleaks/gitleaks#configuration

title = "cicatrix gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for build output, test fixtures, synthetic tokens, and stopwords"
paths = [
    '''target/.*''',
    '''.*/target/.*''',
    '''.*/tests/.*''',
]
regexes = [
    '''[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}''',
    '''(fake|example|test|dummy|placeholder|sample)[A-Za-z0-9_-]*''',
]
stopwords = ["example", "placeholder", "fake", "dummy", "test", "sample"]
