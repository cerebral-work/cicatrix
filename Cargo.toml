[package]
name = "cicatrix"
version = "0.0.0"
edition = "2021"
description = "Regression-memory + convention-drift framework. Approach drawn from wbrown/janus-datalog; bridged into reverie."
license = "MIT"

[[bin]]
name = "cicatrix"
path = "src/main.rs"

[dependencies]
# Blocking HTTP client for the reverie bridge (CLI — no async runtime warranted).
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
