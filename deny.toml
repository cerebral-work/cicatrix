# cargo-deny — supply-chain + license policy for cicatrix.
# Run: cargo deny check   (CI: the `cargo-deny` job in .github/workflows/ci.yml).
# Modeled on the house default (revenant/deny.toml).

[advisories]
version = 2
yanked = "deny"
# No ignores yet — add a RUSTSEC-id here (with a reviewed reason) if an unmaintained
# transitive advisory with no known vuln surfaces.
ignore = []

[licenses]
version = 2
# Permissive licenses only — covers cicatrix (MIT) plus the ureq/rustls/serde tree
# (incl. ring/webpki's OpenSSL+ISC components and the unicode tables).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[bans]
# ureq's TLS tree pulls some duplicate transitive versions — don't fail on that.
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "deny"
